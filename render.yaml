services:
  - type: web
    name: traccia
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm && python scripts/download_models.py
    startCommand: gunicorn --workers 1 --threads 2 --timeout 120 --access-logfile - --error-logfile - app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: SEC_USER_AGENT
        sync: false
      - key: APP_ACCESS_KEY
        sync: false
      - key: FASTEMBED_CACHE_PATH
        value: .model-cache
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: MAX_FILINGS
        value: "4"
      - key: MAX_CHUNKS
        value: "800"
